name: Deploy Staging to GitHub Pages

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-staging"
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest
        
    - name: Install dependencies
      run: bun install
      
    - name: Build chat widget for staging
      run: |
        cd apps/chat-widget
        # Use staging config (point to your staging backend)
        sed -i 's|export const HTTP_BACKEND_URL = "http://localhost:4000/api";|export const HTTP_BACKEND_URL = "https://your-staging-backend.herokuapp.com/api";|g' src/config.ts
        bun run build
        
    - name: Deploy to GitHub Pages (staging)
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./apps/chat-widget/dist
        publish_branch: gh-pages-staging
