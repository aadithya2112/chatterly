name: Deploy Staging to GitHub Pages

on:
  push:
    branches: [ staging ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-staging"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest
        
    - name: Install dependencies
      run: bun install
      
    - name: Build chat widget for staging
      run: |
        cd apps/chat-widget
        # Use staging config
        sed -i 's|// export const HTTP_BACKEND_URL = "http://localhost:4000/api";|export const HTTP_BACKEND_URL = "http://localhost:4000/api";|g' src/config.ts
        sed -i 's|export const HTTP_BACKEND_URL = "https://chatterly.aadithya.tech/api";|// export const HTTP_BACKEND_URL = "https://chatterly.aadithya.tech/api";|g' src/config.ts
        bun run build
        
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./apps/chat-widget/dist

  deploy:
    environment:
      name: github-pages-staging
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
